# SPDX-License-Identifier: MIT
# Lint, Linux coverage (with rendered tests), Linux sanitizers, Windows and
# web, then a cross-platform determinism check. Any failing job fails the run.
# macOS is deferred for now (project decision).
#
# Started by hand for now (Actions > CI > Run workflow) to save build minutes;
# the full gates run locally once per milestone. To run on every push and pull
# request again, add `push:` and `pull_request:` under `on:`.
name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  OPENSPEC_TELEMETRY: "0"
  ZB_NO_DIALOGS: "1"
  PYTHONUNBUFFERED: "1"
  # SDL 3 build dependencies (X11, Wayland, EGL/GL, audio) and Mesa for the rendered tests.
  LINUX_DEPS: >-
    ninja-build libgl1-mesa-dri libegl1 libegl-mesa0 libgles2 libegl-dev libgl-dev libgles-dev
    libx11-dev libxext-dev libxcursor-dev libxi-dev libxrandr-dev libxfixes-dev libxss-dev libxtst-dev
    libxkbcommon-dev libwayland-dev libwayland-bin wayland-protocols libdecor-0-dev
    libasound2-dev libpulse-dev libdbus-1-dev libudev-dev

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-18 lua-check vorbis-tools
          pip install reuse==6.3.0
      - name: clang-format
        run: git ls-files '*.c' '*.h' ':!:third_party/**' | xargs clang-format-18 --dry-run --Werror
      - name: reuse lint
        run: reuse lint
      - name: OpenSpec
        run: npx --yes @fission-ai/openspec@2.1.0 validate --all --strict
      - name: Tool tests
        run: python3 -m unittest discover -s tests/tools -t .
      - name: Module layering
        run: python3 tools/check_includes.py
      - name: License split
        run: python3 tools/check_licenses.py
      - name: Credits
        run: python3 tools/check_credits.py
      - name: Spec scenario coverage
        run: python3 tools/spec_coverage.py
      - name: Lua API reference is current
        run: python3 tools/gen_api_docs.py --check
      - name: luacheck
        run: luacheck --no-color assets tests/lua tests/scenarios tests/fixtures tools/reels tools/design
      - name: Generated assets are reproducible
        run: |
          python3 tools/gen/gen_all.py
          git diff --exit-code -- assets

  linux-gcc-coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y $LINUX_DEPS
          pip install gcovr==8.8
      - name: Configure
        run: cmake --preset coverage
      - name: Build
        run: cmake --build --preset coverage
      - name: Test (unit, engine, rendered on llvmpipe)
        env:
          ZB_LUA_COVERAGE: ${{ github.workspace }}/build/coverage/luacov.stats.out
          ZB_HASH_REPORT: ${{ github.workspace }}/hash-linux.txt
        run: ctest --preset coverage
      - name: C coverage gate
        run: |
          # Terrain loops run billions of times in the tests; gcov's counts are right.
          gcovr --root . --filter src/ --gcov-ignore-parse-errors=suspicious_hits.warn \
            --json-summary build/coverage/coverage.json --html-details build/coverage/coverage.html build/coverage
          python3 tools/coverage_gate.py c --gcovr-json build/coverage/coverage.json \
            --exclusions tools/coverage-exclusions.txt --baseline tools/coverage-baseline.json
      - name: Lua coverage gate
        run: |
          python3 tools/luacov_report.py --lua build/coverage/zb_lua \
            --stats build/coverage/luacov.stats.out --report build/coverage/luacov.report.out \
            --include assets/base/scripts
          python3 tools/coverage_gate.py lua --luacov-report build/coverage/luacov.report.out \
            --include assets/base/scripts --exclusions tools/coverage-exclusions.txt \
            --baseline tools/coverage-baseline.json
      - uses: actions/upload-artifact@v4
        with:
          name: hash-linux
          path: hash-linux.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: |
            build/coverage/coverage.html*
            build/coverage/luacov.report.out
          if-no-files-found: ignore

  linux-clang-asan:
    runs-on: ubuntu-24.04
    env:
      CC: clang
      ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
      LSAN_OPTIONS: suppressions=${{ github.workspace }}/tools/lsan.supp
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y $LINUX_DEPS
      - name: Configure
        run: cmake --preset asan
      - name: Build
        run: cmake --build --preset asan
      - name: Test
        # Rendered tests run in linux-gcc-coverage and linux-render: under LSan the
        # Mesa driver's own allocations (unloaded at exit) cannot be attributed.
        run: ctest --preset asan -LE render

  linux-render:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y $LINUX_DEPS
      - name: Configure and build (release)
        run: |
          cmake --preset release
          cmake --build --preset release
      - name: Rendered tests (SDL offscreen + llvmpipe)
        env:
          ZB_GOLDEN_OUT: ${{ github.workspace }}/golden-out
        run: ctest --preset release -L render
      - name: Performance budgets
        run: ctest --preset release -L perf --output-on-failure
      - name: Documented commands (README)
        env:
          SDL_VIDEO_DRIVER: offscreen
          SDL_AUDIO_DRIVER: dummy
        run: |
          build/release/bin/zauberer --ticks 120 --user-dir "$RUNNER_TEMP/user"
          build/release/bin/zauberer --headless --test tests/lua --junit "$RUNNER_TEMP/lua.xml"
          build/release/bin/zauberer --headless --scenario tests/scenarios/demo_runs.lua
          build/release/bin/zauberer --headless --replay tests/replays/demo.zbrec
          build/release/bin/zauberer --help
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: golden-out
          path: golden-out
          if-no-files-found: ignore

  windows-msvc:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Configure
        run: cmake --preset release
      - name: Build
        run: cmake --build --preset release
      - name: Test
        env:
          ZB_HASH_REPORT: ${{ github.workspace }}/hash-windows.txt
        run: ctest --preset release
      - uses: actions/upload-artifact@v4
        with:
          name: hash-windows
          path: hash-windows.txt
      - uses: actions/upload-artifact@v4
        with:
          name: windows-bin
          path: build/release/bin

  # The windowed run on Mesa's software OpenGL (GitHub's Windows runners have
  # no OpenGL 3.3 driver). Separate from windows-msvc so that the determinism
  # comparison does not wait for it.
  windows-gl-smoke:
    needs: windows-msvc
    runs-on: windows-2022
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-bin
          path: bin
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Windowed smoke run (Mesa llvmpipe)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GALLIUM_DRIVER: llvmpipe
        run: |
          # Recent mesa-dist-win releases have dropped the OpenGL driver from some
          # packages, and the layout changes between releases: take the newest
          # release whose MSVC package has a 64-bit opengl32.dll.
          gl=""
          for tag in $(gh release list --repo pal1000/mesa-dist-win --limit 12 --json tagName --jq '.[].tagName'); do
            rm -rf "$RUNNER_TEMP/mesa" "$RUNNER_TEMP/mesa-dl"
            mkdir -p "$RUNNER_TEMP/mesa-dl"
            gh release download "$tag" --repo pal1000/mesa-dist-win --pattern '*release-msvc.7z' \
              --dir "$RUNNER_TEMP/mesa-dl" || continue
            for archive in "$RUNNER_TEMP"/mesa-dl/*.7z; do 7z x -y -o"$RUNNER_TEMP/mesa" "$archive" > /dev/null; done
            all="$(find "$RUNNER_TEMP/mesa" -iname opengl32.dll || true)"
            gl="$(echo "$all" | grep -i '64' | head -n 1 || true)"
            if [ -z "$gl" ]; then gl="$(echo "$all" | grep -iv 'x86\|32bit\|win32' | grep . | head -n 1 || true)"; fi
            if [ -n "$gl" ]; then echo "Mesa release $tag"; break; fi
            echo "Mesa release $tag has no 64-bit opengl32.dll"
          done
          test -n "$gl" || { echo "no 64-bit opengl32.dll in recent Mesa releases"; exit 1; }
          echo "Mesa OpenGL: $gl"
          ls "$(dirname "$gl")"
          cp "$(dirname "$gl")"/*.dll bin/
          for dll in opengl32 libgallium_wgl libglapi; do
            if [ -f "bin/$dll.dll" ]; then dumpbin //dependents "bin/$dll.dll" | grep -i '\.dll'; fi
          done
          # Make SDL load Mesa's opengl32.dll rather than the system's GDI OpenGL 1.1.
          export SDL_OPENGL_LIBRARY="$(cygpath -w "$PWD/bin/opengl32.dll")"
          bin/zauberer.exe --ticks 120 --user-dir "$RUNNER_TEMP/user" 2>&1 | tee smoke.log
          grep -q "first frame presented" smoke.log

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Emscripten
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install "$(cat cmake/emsdk-version.txt)"
          "$RUNNER_TEMP/emsdk/emsdk" activate "$(cat cmake/emsdk-version.txt)"
          echo "EMSDK=$RUNNER_TEMP/emsdk" >> "$GITHUB_ENV"
      - name: Build web, web-st and web-node
        run: |
          source "$EMSDK/emsdk_env.sh"
          for preset in web web-st web-node; do
            cmake --preset "$preset"
            cmake --build --preset "$preset"
          done
      - name: Unit and headless engine tests under Node.js
        env:
          ZB_HASH_REPORT: ${{ github.workspace }}/hash-web.txt
        run: |
          source "$EMSDK/emsdk_env.sh"
          ctest --preset web-node
      - name: Native host for the browser co-op test
        run: |
          cmake -S . -B build/host -G Ninja -DCMAKE_BUILD_TYPE=Release -DZB_HEADLESS_ONLY=ON -DZB_TESTS=OFF
          cmake --build build/host --target zauberer
      - name: Browser tests (Playwright, Chromium)
        working-directory: tests/web
        env:
          ZB_WEB_ST_DIR: ${{ github.workspace }}/build/web-st/bin
          ZB_WEB_MT_DIR: ${{ github.workspace }}/build/web/bin
          ZB_NATIVE_BIN: ${{ github.workspace }}/build/host/bin/zauberer
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          node --test --test-concurrency=1 web.test.mjs
      - name: Assemble the web build
        run: |
          mkdir -p dist
          cp -r build/web-st/bin/. dist/
          cp build/web/bin/zauberer.js build/web/bin/zauberer.wasm dist/
      - uses: actions/upload-artifact@v4
        with:
          name: zauberer-web
          path: dist
      - uses: actions/upload-artifact@v4
        with:
          name: hash-web
          path: hash-web.txt

  determinism:
    needs: [linux-gcc-coverage, windows-msvc, web]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: hash-*
          path: hashes
      - name: Compare final replay hashes
        run: |
          python3 tools/compare_hashes.py \
            linux=hashes/hash-linux/hash-linux.txt windows=hashes/hash-windows/hash-windows.txt \
            web=hashes/hash-web/hash-web.txt
