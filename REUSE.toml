# REUSE 3 metadata for files that cannot carry an SPDX header.
# Later entries win over earlier ones (as in the REUSE specification), so
# general patterns come first and specific ones after. Code is MIT, art and
# documentation are CC-BY-4.0; third-party code keeps its upstream license.
version = 1

[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Zauberer contributors"

# Project files without room for a header (JSON, ignore lists, agent skills).
[[annotations]]
path = [".gitignore", "CMakePresets.json", "cmake/**", "tests/**", "tools/**", "web/**", ".agents/**", ".claude/**"]
SPDX-FileCopyrightText = "2026 Zauberer contributors"
SPDX-License-Identifier = "MIT"

# Documentation and planning.
[[annotations]]
path = ["README.md", "docs/**", "openspec/**"]
SPDX-FileCopyrightText = "2026 Zauberer contributors"
SPDX-License-Identifier = "CC-BY-4.0"

# Generated art and sound of the packages (credited in each credits.lua).
[[annotations]]
path = ["assets/**/*.png", "assets/**/*.glb", "assets/**/*.gltf", "assets/**/*.ogg", "assets/**/*.wav", "assets/**/*.bin"]
SPDX-FileCopyrightText = "2026 Zauberer contributors"
SPDX-License-Identifier = "CC-BY-4.0"

# Third-party code (see third_party/VENDORED.md).
[[annotations]]
path = "third_party/VENDORED.md"
SPDX-FileCopyrightText = "2026 Zauberer contributors"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = "third_party/impl/**"
SPDX-FileCopyrightText = "2026 Zauberer contributors"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = "third_party/lua/**"
precedence = "override"
SPDX-FileCopyrightText = "1994-2025 Lua.org, PUC-Rio"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = "third_party/stb/**"
precedence = "override"
SPDX-FileCopyrightText = "2017 Sean Barrett"
SPDX-License-Identifier = "MIT OR Unlicense"

[[annotations]]
path = "third_party/cgltf/**"
precedence = "override"
SPDX-FileCopyrightText = "2018-2021 Johannes Kuhlmann"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = "third_party/unity/**"
precedence = "override"
SPDX-FileCopyrightText = "2007-25 Mike Karlesky, Mark VanderVoord, Greg Williams"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = "third_party/luacov/**"
precedence = "override"
SPDX-FileCopyrightText = "2007-2010 Hisham Muhammad, 2012-2022 LuaCov contributors"
SPDX-License-Identifier = "MIT"
